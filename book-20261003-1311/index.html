<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<meta name="description" content="">
<meta name="theme-color" content="#323232">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./viewer.css?v=20261003-1311-21u9">
</head>
<body>
<!-- 界面文字由 viewer.js 按当前语言填入：data-i18n=文字，data-i18n-title=悬停提示，data-i18n-aria=读屏标签，data-i18n-ph=输入框提示 -->
<div id="app">
  <div id="loading"><div class="spinner"></div><p id="loadingText" data-i18n="loading">加载中…</p></div>

  <main id="stage">
    <div id="bookWrap"><div id="book"></div></div>
    <button class="nav-arrow prev" id="btnPrev" data-i18n-title="prevKey" data-i18n-aria="prev"><svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg></button>
    <button class="nav-arrow next" id="btnNext" data-i18n-title="nextKey" data-i18n-aria="next"><svg viewBox="0 0 24 24"><path d="M9 4l8 8-8 8"/></svg></button>
    <button class="nav-end first" id="btnFirst" data-i18n-title="firstKey" data-i18n-aria="first"><svg viewBox="0 0 24 24"><path d="M17 6l-6 6 6 6M7 6v12"/></svg></button>
    <button class="nav-end last" id="btnLast" data-i18n-title="lastKey" data-i18n-aria="last"><svg viewBox="0 0 24 24"><path d="M7 6l6 6-6 6M17 6v12"/></svg></button>
  </main>

  <!-- zoom layer -->
  <div id="zoomLayer" hidden>
    <div id="zoomScroll"><div id="zoomInner"></div></div>
    <div class="zoom-ctrl">
      <button id="zoomOut" data-i18n-aria="zoomOut"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <span id="zoomVal">200%</span>
      <button id="zoomIn2" data-i18n-aria="zoomIn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="zoomClose" data-i18n-aria="zoomClose"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>

  <footer id="toolbar">
    <button class="tb" id="btnHome" data-i18n-title="home" data-i18n-aria="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 9.5V20h12V9.5"/></svg></button>
    <button class="tb" id="btnZoom" data-i18n-title="zoomIn" data-i18n-aria="zoomIn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <span id="pageNum">1/1</span>
    <div id="sliderWrap"><input type="range" id="slider" min="1" max="1" value="1" data-i18n-aria="pageNo"><div id="sliderTip"></div></div>
    <button class="tb" id="btnSearch" data-i18n-title="search" data-i18n-aria="search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg></button>
    <button class="tb" id="btnThumbs" data-i18n-title="thumbs" data-i18n-aria="thumbs"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1"/></svg></button>
    <button class="tb lang" id="btnLang" data-i18n="langBtn" data-i18n-title="langTip" data-i18n-aria="langTip">EN</button>
    <button class="tb" id="btnMore" data-i18n-title="more" data-i18n-aria="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3" class="fill"/><circle cx="12" cy="12" r="1.3" class="fill"/><circle cx="19" cy="12" r="1.3" class="fill"/></svg></button>
  </footer>

  <!-- more menu -->
  <div id="moreMenu" class="popmenu" hidden>
    <button data-act="fullscreen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span data-i18n="fullscreen">全屏</span></button>
    <button data-act="autoplay"><svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg><span id="autoplayLabel">自动翻页</span></button>
    <button data-act="sound"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10zM16 9a4 4 0 010 6"/></svg><span id="soundLabel">翻页声音：开</span></button>
    <button data-act="share" id="shareItem"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><path d="M14 14h2v2h-2zM18 18h2v2h-2zM14 18h2M18 14h2"/></svg><span data-i18n="shareMenu">分享 / 二维码</span></button>
    <button data-act="install" id="installItem"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span data-i18n="installMenu">安装到手机 / 桌面</span></button>
    <button data-act="download" id="downloadItem" hidden><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v4h4"/></svg><span data-i18n="downloadPdf">下载 PDF</span></button>
  </div>

  <!-- side panels -->
  <aside id="thumbPanel" class="panel" hidden>
    <div class="panel-head"><b data-i18n="thumbs">缩略图</b><button class="close" data-close="thumbPanel" data-i18n-aria="close">×</button></div>
    <div id="thumbGrid"></div>
  </aside>
  <aside id="searchPanel" class="panel" hidden>
    <div class="panel-head"><b data-i18n="search">搜索</b><button class="close" data-close="searchPanel" data-i18n-aria="close">×</button></div>
    <form id="searchForm"><input id="searchInput" type="search" data-i18n-ph="searchPh" autocomplete="off"><button type="submit" data-i18n="search">搜索</button></form>
    <div id="searchResults"></div>
  </aside>

  <!-- dialogs -->
  <div id="shareDlg" class="dlg" hidden>
    <div class="dlg-box">
      <button class="close" data-close="shareDlg" data-i18n-aria="close">×</button>
      <h3 data-i18n="scanToRead">扫码阅读</h3>
      <div id="qrBox"></div>
      <input id="shareUrl" readonly>
      <label class="chk"><input type="checkbox" id="sharePage"> <span data-i18n="fromThisPage">从当前页打开</span></label>
      <div class="dlg-btns"><button id="copyUrl" data-i18n="copyLink">复制链接</button><button id="saveQr" data-i18n="saveQr">保存二维码</button><button id="nativeShare" data-i18n="shareDots" hidden>分享…</button></div>
    </div>
  </div>
  <div id="installDlg" class="dlg" hidden>
    <div class="dlg-box">
      <button class="close" data-close="installDlg" data-i18n-aria="close">×</button>
      <h3 data-i18n="installTitle">安装到手机</h3>
      <div id="installBody"></div>
    </div>
  </div>
  <div id="installBar" hidden>
    <img src="./icons/icon-192.png" alt="">
    <span id="installBarText"></span>
    <button id="installNow" data-i18n="install">安装</button>
    <button id="installLater" data-i18n-aria="close">×</button>
  </div>
  <div id="toast"></div>
</div>
<script src="./lib/page-flip.browser.js?v=20261003-1311-21u9"></script>
<script src="./lib/qrcode.js?v=20261003-1311-21u9"></script>
<script src="./viewer.js?v=20261003-1311-21u9"></script>
</body>
</html>
